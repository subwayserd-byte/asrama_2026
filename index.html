<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Aduan Kerosakan Asrama | TVETMARA Lenggong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-brand: #b91c1c;
      --color-brand-hover: #991b1b;
      --color-brand-light: #fef2f2;
      --color-bg: #f8f9fa;
      --color-surface: #ffffff;
      --color-text-main: #111827;
      --color-text-muted: #4b5563;
      --color-border: #e5e7eb;
      --color-border-dark: #111827;
      --color-badge-bg: #e5e7eb;
      --status-pending: #d97706;
      --status-pending-bg: #fef3c7;
      --status-process: #2563eb;
      --status-process-bg: #dbeafe;
      --status-done: #16a34a;
      --status-done-bg: #dcfce7;
      --font-heading: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
      --container-max: 1200px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--color-bg);
      color: var(--color-text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding-left: clamp(1.25rem, 4vw, 2.5rem);
      padding-right: clamp(1.25rem, 4vw, 2.5rem);
    }

    /* HEADER */
    .site-header {
      background-color: var(--color-surface);
      border-bottom: 2px solid var(--color-border-dark);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 80px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--color-text-main);
    }

    .logo-svg {
      height: 38px;
      width: auto;
    }

    .logo-divider {
      height: 28px;
      width: 2px;
      background-color: var(--color-border-dark);
    }

    .logo-text {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
      display: flex;
      flex-direction: column;
    }

    .logo-text span {
      font-size: 0.75rem;
      color: var(--color-brand);
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 2px solid var(--color-border-dark);
      border-radius: 0px;
      transition: all 0.15s ease;
      background-color: var(--color-surface);
      color: var(--color-text-main);
    }

    .btn-primary {
      background-color: var(--color-brand);
      color: white;
      border-color: var(--color-brand);
    }

    .btn-primary:hover {
      background-color: var(--color-brand-hover);
      border-color: var(--color-brand-hover);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--color-text-main);
      border-color: var(--color-border-dark);
    }

    .btn-outline:hover {
      background-color: var(--color-text-main);
      color: white;
    }

    .btn-sm {
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
    }

    /* HERO SECTION */
    .hero {
      padding: 3.5rem 0 4rem;
      background-color: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 3rem;
      align-items: center;
    }

    .hero-tag {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background-color: var(--color-brand-light);
      color: var(--color-brand);
      border: 1px solid #fca5a5;
      font-size: 0.8125rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.25rem;
    }

    .hero-title {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 4vw, 3.25rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
    }

    .hero-desc {
      font-size: 1.125rem;
      color: var(--color-text-muted);
      margin-bottom: 2rem;
      max-width: 580px;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      padding-top: 2rem;
      border-top: 1px solid var(--color-border);
      margin-top: 2rem;
    }

    .stat-number {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--color-text-main);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .hero-image-box {
      width: 100%;
      aspect-ratio: 4/3;
      background-color: #e2e8f0;
      border: 2px solid var(--color-border-dark);
      position: relative;
      overflow: hidden;
      box-shadow: 6px 6px 0px var(--color-border-dark);
    }

    .hero-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* SECTION STYLES */
    .section-padding {
      padding: 4rem 0;
    }

    .section-header {
      margin-bottom: 2.5rem;
    }

    .section-subtitle {
      font-size: 0.8125rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--color-brand);
      letter-spacing: 0.05em;
    }

    .section-title {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-top: 0.25rem;
    }

    /* EMERGENCY SECTION */
    .emergency-banner {
      background-color: #fef2f2;
      border: 2px solid #ef4444;
      padding: 1.5rem 2rem;
      margin-bottom: 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .emergency-info h3 {
      font-family: var(--font-heading);
      color: #991b1b;
      font-size: 1.125rem;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .emergency-contacts {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .contact-card {
      background: white;
      padding: 0.75rem 1rem;
      border: 1px solid #fca5a5;
      font-size: 0.875rem;
    }

    .contact-card strong {
      display: block;
      font-size: 0.75rem;
      color: #991b1b;
      text-transform: uppercase;
    }

    .contact-card a {
      color: var(--color-text-main);
      text-decoration: none;
      font-weight: 700;
    }

    /* FEATURES GRID */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    .feature-card {
      background-color: var(--color-surface);
      border: 2px solid var(--color-border-dark);
      padding: 1.75rem;
      position: relative;
    }

    .feature-num {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--color-border);
      line-height: 1;
      margin-bottom: 1rem;
    }

    .feature-title {
      font-family: var(--font-heading);
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .feature-desc {
      font-size: 0.875rem;
      color: var(--color-text-muted);
    }

    /* LEAD FORM SECTION */
    .form-wrapper {
      background-color: var(--color-surface);
      border: 2px solid var(--color-border-dark);
      box-shadow: 8px 8px 0px var(--color-border-dark);
      padding: 2.5rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group.full {
      grid-column: span 2;
    }

    label {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--color-text-main);
    }

    input[type="text"],
    input[type="password"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      font-family: var(--font-body);
      font-size: 0.875rem;
      border: 2px solid var(--color-border-dark);
      background-color: #fff;
      border-radius: 0;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--color-brand);
      background-color: #fff;
    }

    /* CATEGORY SELECTOR */
    .category-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .cat-btn {
      padding: 0.75rem;
      border: 2px solid var(--color-border);
      text-align: center;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      background: white;
      transition: all 0.15s ease;
    }

    .cat-btn.active {
      border-color: var(--color-brand);
      background-color: var(--color-brand-light);
      color: var(--color-brand);
    }

    /* FILE UPLOAD DROPZONE */
    .file-dropzone {
      border: 2px dashed var(--color-border-dark);
      padding: 1.5rem;
      text-align: center;
      background: var(--color-bg);
      cursor: pointer;
      position: relative;
    }

    .file-dropzone input {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .preview-image {
      max-height: 120px;
      margin-top: 0.5rem;
      display: none;
      border: 1px solid var(--color-border-dark);
    }

    /* TRACKER SECTION */
    .tracker-card {
      background-color: var(--color-surface);
      border: 2px solid var(--color-border-dark);
      padding: 2rem;
      margin-top: 2rem;
    }

    .tracker-input-group {
      display: flex;
      gap: 0.5rem;
      max-width: 500px;
      margin-top: 1rem;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 7
