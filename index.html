<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Portal Aduan Asrama | TVETMARA Lenggong</title>
  <script>
    (async () => {
      const maintenanceUrl = "/maintenance.html";
      const portalUrl = "/portal.html";
      try {
        const response = await fetch(`/maintenance-status.json?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error("Status penyelenggaraan tidak tersedia.");
        const status = await response.json();
        window.location.replace(status.maintenance === true ? maintenanceUrl : portalUrl);
      } catch (error) {
        window.location.replace(maintenanceUrl);
      }
    })();
  </script>
</head>
<body>
  <p>Memuatkan portal TVETMARA Lenggong…</p>
  <noscript>Portal memerlukan JavaScript untuk memeriksa status penyelenggaraan.</noscript>
</body>
</html>
